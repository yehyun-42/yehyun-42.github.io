<h2 style="text-align:center; margin-bottom:20px; font-weight:bold;">사용자 정보 수정</h2>
<form action="{{ url_for('crud.edit_user', user_id=user.id) }}" method="POST">
    {{ form.csrf_token }}
    
    <div class="form-group" style="margin-bottom:15px;">
        <label>권한 설정</label>
        <select name="role" style="width:100%; padding:10px; border:1px solid #87caf7; border-radius:4px;">
            <option value="monitoring" {% if user.role == 'monitoring' %}selected{% endif %}>모니터링</option>
            <option value="drone" {% if user.role == 'drone' %}selected{% endif %}>드론요원</option>
            <option value="standby" {% if user.role == 'standby' %}selected{% endif %}>상황대기조</option>
            <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>관리자</option>
            <option value="pending" {% if user.role == 'pending' %}selected{% endif %}>승인대기</option>
        </select>
    </div>

    <div class="form-group" style="margin-bottom:15px;">
        <label>사용자명</label>
        <input type="text" name="username" value="{{ user.username }}" style="width:100%; padding:10px; border:1px solid #87caf7; border-radius:4px;">
    </div>

    <div class="form-group" style="margin-bottom:15px;">
        <label>이메일</label>
        <input type="email" name="email" value="{{ user.email }}" style="width:100%; padding:10px; border:1px solid #87caf7; border-radius:4px;">
    </div>

    <div class="form-group" style="margin-bottom:15px;">
        <label>비밀번호</label>
        <input type="password" name="password" placeholder="변경 시에만 입력" style="width:100%; padding:10px; border:1px solid #87caf7; border-radius:4px;">
    </div>

    <div class="btn-container" style="display:flex; justify-content:center; gap:10px; margin-top:20px;">
    <button type="submit" class="btn-custom btn-blue" style="padding:10px 20px; background:#2563eb; color:white; border:none; border-radius:4px; cursor:pointer;">갱신</button>
    
    <button type="button" class="btn-custom btn-green" style="padding:10px 20px; background:#16a34a; color:white; border:none; border-radius:4px; cursor:pointer;" onclick="document.getElementById('edit-modal').style.display='none'">취소</button>
    
    <button type="button" class="btn-custom btn-red" 
            style="padding:10px 20px; background:#dc2626; color:white; border:none; border-radius:4px; cursor:pointer;" 
            onclick="if(confirm('정말 이 사용자를 삭제하시겠습니까?')) { location.href='{{ url_for('crud.delete_user', user_id=user.id) }}'; }">
        삭제
    </button>
</div>
    
</form>
